name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-

      - name: Build Next.js
        run: npm run build

      # Preferred: provision a real Neon project/branch (DB + Managed Neon Auth)
      # with the Neon CLI driven by NEON_API_KEY. Falls back to the local
      # Postgres service + Replit-free dummy auth env when no key is configured.
      - name: Provision Neon database and auth (NEON_API_KEY)
        if: env.NEON_API_KEY != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          ONA_NEON_BRANCH="ona-ci-${GITHUB_RUN_ID}" bash scripts/neon-setup.sh

      - name: Provision Neon database and auth (optional)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY not set - falling back to the local Postgres service container"
            {
              echo "POSTGRES_URL=postgresql://postgres:postgres@localhost:5432/ona"
              echo "SESSION_SECRET=ci-smoke-test-secret-value-32-chars-min"
              echo "NEON_AUTH_COOKIE_SECRET=ci-smoke-test-secret-value-32-chars-min-0"
            } > .env.local
          else
            ONA_NEON_BRANCH="ona-ci-${GITHUB_RUN_ID}" bash scripts/neon-setup.sh
          fi

      - name: Smoke test — server boots, health endpoint and auth flow respond
        run: |
          # Start the server directly (not via npm) so SERVER_PID is the real
          # server process and the later kill in this step works reliably.
          npx next start -p 5000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/healthz || true)
            if [ "$code" = "200" ]; then
              echo "healthz returned 200 after ~$((i * 2))s"
              curl -sf http://localhost:5000/api/healthz
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::/api/healthz did not return 200 within 60s"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          # Auth flow smoke test (Neon Auth via /api/auth proxy)
          ORIGIN=http://localhost:5000
          EMAIL="ci-$GITHUB_RUN_ID-$(date +%s)@ona-smoke.test"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -X POST "$ORIGIN/api/auth/sign-up/email" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"ci-smoke-pass-123\",\"name\":\"CI Smoke\"}")
          if [ "$CODE" != "200" ]; then
            echo "::error::Neon Auth sign-up returned HTTP $CODE"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "Neon Auth sign-up returned 200"
          kill $SERVER_PID 2>/dev/null || true
          exit 0
        env:
          FIREWORKS_API_KEY: dummy-key-for-ci
          # Used only when the Neon provisioning step did not run (no NEON_API_KEY secret)
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ona
          SESSION_SECRET: ci-smoke-test-secret-value-32-chars-min
          NEON_AUTH_COOKIE_SECRET: ci-smoke-test-secret-value-32-chars-min
      - name: Smoke test - auth flow against Neon (optional)
        if: ${{ hashFiles('.env.local') != '' }}
        run: |
          if ! grep -q '^NEON_AUTH_BASE_URL=' .env.local; then
            echo "Neon Auth not configured - skipping auth flow check"
            exit 0
          fi
          # A previous step's server may still hold port 5000 (npm kills the
          # wrapper, not the node child) - clear it before binding.
          pkill -f 'next-server' 2>/dev/null || true
          sleep 2
          npx next start -p 5000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/auth/ok || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          [ "$code" = "200" ] || { echo "::error::auth handler did not start"; kill $SERVER_PID 2>/dev/null; exit 1; }
          rm -f cookies.txt
          EMAIL="ci-$GITHUB_RUN_ID-$(date +%s)@ona-smoke.test"
          signup=$(curl -s -c cookies.txt -X POST http://localhost:5000/api/auth/sign-up/email \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:5000' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"supersecret123\",\"name\":\"CI Smoke\"}")
          echo "$signup" | head -c 200
          if ! echo "$signup" | grep -q '"user"'; then
            echo "sign-up failed - retrying as sign-in (user may persist across runs on the same branch)"
            signin=$(curl -s -c cookies.txt -X POST http://localhost:5000/api/auth/sign-in/email \
              -H 'Content-Type: application/json' -H 'Origin: http://localhost:5000' \
              -d "{\"email\":\"$EMAIL\",\"password\":\"supersecret123\"}")
            echo "$signin" | head -c 200
            echo "$signin" | grep -q '"user"' || { echo "::error::Neon Auth sign-up/sign-in failed"; kill $SERVER_PID 2>/dev/null; exit 1; }
          fi
          user=$(curl -s -b cookies.txt http://localhost:5000/api/auth/user)
          echo "session user: $user"
          echo "$user" | grep -q 'ona-smoke.test' || { echo "::error::session cookie did not resolve a user"; kill $SERVER_PID 2>/dev/null; exit 1; }
          echo "Auth flow OK"
          kill $SERVER_PID 2>/dev/null || true
        env:
          FIREWORKS_API_KEY: dummy-key-for-ci

      - name: Vercel — sync Neon auth and database env via CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/vercel-setup.sh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Cleanup throwaway Neon CI branches (optional)
        if: ${{ always() && env.NEON_API_KEY != '' }}
        run: |
          ids=$(npx -y neon@latest branches list -o json 2>/dev/null \
            | jq -r '(if type=="array" then . else .branches end)[] | select(.name | startswith("ona-ci-")) | .id')
          for id in $ids; do
            npx -y neon@latest branches delete "$id" -y >/dev/null 2>&1 && echo "deleted branch $id" || true
          done
