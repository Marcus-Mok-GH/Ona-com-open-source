name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-

      - name: Build Next.js
        run: npm run build

      - name: Smoke test — server boots and health endpoint responds
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/healthz || true)
            if [ "$code" = "200" ]; then
              echo "healthz returned 200 after ~$((i * 2))s"
              curl -sf http://localhost:5000/api/healthz
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/healthz did not return 200 within 60s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ona
          SESSION_SECRET: ci-smoke-test-secret-value-32-chars-min
          FIREWORKS_API_KEY: dummy-key-for-ci
